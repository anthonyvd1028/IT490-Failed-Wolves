<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Games</title>
  <link rel="stylesheet" href="style.css">
  <script>

    window.onload = function () {
      let sessionId = sessionStorage.getItem("sessionId");
      if (!sessionId) {
        window.location.href = "http://www.sample.com/login.html";
      } else {
        var request = new XMLHttpRequest();
        request.open("POST","message.php",true);
        request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        request.onreadystatechange = function () { 
          if (this.readyState == 4 && this.status == 200) {
            if (JSON.parse(this.responseText).valid) {
              document.body.style.display = "block";
	      displayGames();
            } else {
              window.location.href = "http://www.sample.com/login.html";
            }
          }               
        }
      }
        request.send("type=validateSession&sessionId=" + sessionId);
      };
      
      function displayGames() {
	const games = new XMLHttpRequest();
	games.open("POST", "message.php", true);
	games.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
	games.onreadystatechange = function () {
	   if (this.readyState == 4 && this.status == 200) {
	      const results = JSON.parse(this.responseText);
	      console.log(results);
	      renderTable(results);
            }
	};
	games.send("type=getOdds");

      }
      
      function renderTable(data) {
	const events = data.data.events;
	for (const key in events) {
	   const game = events[key];

	   const headerRow = document.createElement("tr");
	   const cellHeader = document.createElement("td");
	   cellHeader.colSpan = 9;
	   cellHeader.className = "game-header";
	   cellHeader.textContent = `${game.away} @ ${game.home} - ${formatTime(game.startsAt)}`;
	   headerRow.appendChild(cellHeader);
	   tableBody.appendChild(headerRow);
	   

	   const oddRows = [
		{ label: "Away ML", keys: ["awayML"] },
		{ label: "Home ML", keys: ["homeML"] },
		{ label: "Home Spread", keys: ["homeSpread"] },
		{ label: "Away Spread", keys: ["awaySpread"] },
		{ label: "Over", keys: ["over"] },
		{ label: "Under", keys: ["under"] }
	   ];

	   oddRows.forEach((rowInfo) => {
		const tr = document.createElement("tr");
		
		const rowHeader = document.createElement("th");
		rowHeader.textContent = rowInfo.label;
		tr.appendChild(rowHeader);

		const sportsbook = ["fanduel", "draftkings", "betmgm", "caesars", "espnbet", "bovada", "unibet", "pointsbet"];
		sportsbook.forEach((book) => {  
		   const td = document.createElement("td");
		   const odds = game.odds[book];
		   if (odds && odds[rowInfo.keys[0]]) {
			const val = odds[rowInfo.keys[0]];
			td.innerHTML = val.odds + (val.value ? `<br>${val.value}` : "");

		   } else {
			td.textContent = "-";
		   }
		   tr.appendChild(td);
		});

		tableBody.appendChild(tr);
	    });
	}
}


function fmtTime(str) {
      const d = new Date(str.replace(" ", "T"));
      return d.toLocaleString("en-US", {
	  weekday: "short",
	  hour: "numeric",
	  minute: "2-digit",
	  hour12: true
      });
  }

  </script>
</head>

      <a href="bovada.html">Bovada</a>

  <div class="container">
    <div class="card">
      <h1>View all NFL games here.</h1>
      <p>List of Games:</p>
    </div>

	<thead>

	    <th>Game</th>
	    <th>FanDuel</th>
	    <th>DraftKings</th>

	    <th>Caesars</th>
