<!DOCTYPE html>
<html lang="en">	
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetTracker | My Watchlist</title>
  <link rel="stylesheet" href="style.css">

  <script>
    window.onload = function () {
      let sessionId = sessionStorage.getItem("sessionId");
      if (!sessionId) {
        window.location.href = "http://www.sample.com/login.html";
      } else {
        var request = new XMLHttpRequest();
        request.open("POST","message.php",true);
        request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        request.onreadystatechange = function () { 
          if (this.readyState == 4 && this.status == 200) {
            if (JSON.parse(this.responseText).valid) {
              document.body.style.display = "block";
            } else {
              window.location.href = "http://www.sample.com/login.html";
            }
          }               
        }
        request.send("type=validateSession&sessionId=" + sessionId);
      
	var watchlist = new XMLHttpRequest();
        watchlist.open("POST","message.php",true);
        watchlist.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        watchlist.onreadystatechange = function () { 
          if (this.readyState == 4 && this.status == 200) {
            	const watch = JSON.parse(this.responseText);
		const body = document.getElementById("watchList");
		watch.watchlist.forEach(entry => {
			body.innerHTML += `<tr><td>${entry.event}</td><td>${entry.sportsbook}</td><td>${entry.watching}</td><td>${entry.startTime}</td><td>${entry.odds}</td></tr>`;
		});
            }
          }               
        }
        watchlist.send("type=getWatchlist&sessionId=" + sessionId);
      }
    
  </script>

</head>
<body style="display:none;">

  <div class="watchlist">
    <div class="watchlistCard">
      <h1>My Watchlist</h1>
    	<table class = "differentOdds">
		<thead>
			<tr>
			   <th>Game</th>
			   <th>Sportsbook</th>
			   <th>Bet</th>
			   <th>Time</th>
			   <th>Odds</th>
			</tr>
		</thead>
		<tbody id="watchList">
		</tbody>
	</table> 
    </div>
