
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetTracker - Bovada</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.onload = function () {
      let sessionId = sessionStorage.getItem("sessionId");
      if (!sessionId) {
        window.location.href = "http://www.sample.com/login.html";
      } else {
        var request = new XMLHttpRequest();
        request.open("POST","message.php",true);
        request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        request.onreadystatechange = function () { 
          if (this.readyState == 4 && this.status == 200) {
            if (JSON.parse(this.responseText).valid) {
              document.body.style.display = "block";
            } else {
              window.location.href = "http://www.sample.com/login.html";
            }
          }               
        }
        request.send("type=validateSession&sessionId=" + sessionId);
        
	var games = new XMLHttpRequest();
        games.open("POST","message.php",true);
        games.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        games.onreadystatechange = function () { 
          if (this.readyState == 4 && this.status == 200) {
			const results = JSON.parse(this.responseText);
			console.log(results);
	  	}               
        }
        games.send("type=getOddsSportsbook&sportsbook=bovada");
      
      }
    }
  </script>
</head>
