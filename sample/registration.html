<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function HandleRegistrationResponse(response) {
      var text = JSON.parse(response).message;
      document.getElementById("textResponse").innerHTML = "<p>response: " + text + "</p>";
    }

    function SendRegistrationRequest() {
      var email = encodeURIComponent(document.getElementById("email").value);
      var username = document.getElementById("uname").value;
      var password = document.getElementById("pword").value;
      var password2 = document.getElementById("pword2").value;

      var request = new XMLHttpRequest();
      request.open("POST","message.php",true);
      request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
      request.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
          HandleRegistrationResponse(this.responseText);
        }
      };
      request.send("type=registration&uname=" + username + "&pword=" + password + "&pword2=" + password2 + "&email=" + email);
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <h2>BetTracker</h2>
    <ul class="nav-links">
      <li><a href="login.html">Login</a></li>
      <li><a href="#" class="disabled">Register</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="card">
      <h1>Register</h1>

      
      <label for="email">Email:</label>
      <input type="text" id="email" name="email">

      <label for="uname">Username:</label>
      <input type="text" id="uname" name="uname">

      <label for="pword">Password:</label>
      <input type="password" id="pword" name="pword">

      <label for="pword2">Confirm Password:</label>
      <input type="password" id="pword2" name="pword2">

      <button onclick="SendRegistrationRequest()">Register</button>

      <div id="textResponse"></div>

    </div>
  </div>
</body>
</html>
