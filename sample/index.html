<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.onload = function () {
      let sessionId = sessionStorage.getItem("sessionId");
      if (!sessionId) {
        window.location.href = "http://www.sample.com/login.html";
      } else {
        var request = new XMLHttpRequest();
        request.open("POST","message.php",true);
        request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        request.onreadystatechange = function () { 
          if (this.readyState == 4 && this.status == 200) {
            if (JSON.parse(this.responseText).valid) {
              document.body.style.display = "block";
            } else {
              window.location.href = "http://www.sample.com/login.html";
            }
          }               
        }
        request.send("type=validateSession&sessionId=" + sessionId);
      }
    }
  </script>
</head>
<body style="display:none;">
  <nav class="navbar">
    <h2>failedwolves.</h2>
    <ul class="nav-links">
      <li><a href="#" class="disabled">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="registration.html">Register</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="card">
      <h1>Welcome!</h1>
      <p>You are successfully logged in.</p>
    </div>
  </div>
</body>
</html>
