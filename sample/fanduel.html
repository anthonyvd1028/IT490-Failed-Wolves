<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetTracker - FanDuel</title>
  <link rel="stylesheet" href="style.css">

  <script>
    window.onload = function () {
      let sessionId = sessionStorage.getItem("sessionId");
      if (!sessionId) {
        window.location.href = "http://www.sample.com/login.html";
      } else {
        // Validate session
        var request = new XMLHttpRequest();
        request.open("POST", "message.php", true);
        request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        request.onreadystatechange = function () {
          if (this.readyState == 4 && this.status == 200) {
            if (JSON.parse(this.responseText).valid) {
              document.body.style.display = "block";
            } else {
              window.location.href = "http://www.sample.com/login.html";
            }
          }
        };
        request.send("type=validateSession&sessionId=" + sessionId);

        // Get odds for FanDuel
        var games = new XMLHttpRequest();
        games.open("POST", "message.php", true);
        games.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        games.onreadystatechange = function () {
          if (this.readyState == 4 && this.status == 200) {
            const results = JSON.parse(this.responseText);
            console.log(results); // Keep for debugging
            renderOddsTables(results);
          }
        };
        games.send("type=getOddsSportsbook&sportsbook=fanduel");
      }
    };

    // Format start time
    function formatTime(str) {
      const d = new Date(str.replace(" ", "T"));
      return d.toLocaleString("en-US", {
        weekday: "short",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });
    }

    // Render all odds cards
    function renderOddsTables(data) {
      const container = document.getElementById("oddsContainer");
      const events = data.data.events;
      for (const key in events) {
        const game = events[key];
        renderOneGame(game, container);
      }
    }

    // Store selected bets
    let selectedBets = [];

    // Toggle selection
    function toggleBetSelection(cell, betInfo) {
      const index = selectedBets.findIndex(
        (b) =>
          b.team === betInfo.team &&
          b.type === betInfo.type &&
          b.game === betInfo.game
      );

      if (index > -1) {
        selectedBets.splice(index, 1);
        cell.classList.remove("selected");
      } else {
        selectedBets.push(betInfo);
        cell.classList.add("selected");
      }

      updateBetBar();
    }

    // Update floating bet bar
    function updateBetBar() {
      const betBar = document.getElementById("betBar");
      const betCount = document.getElementById("betCount");

      if (selectedBets.length > 0) {
        betBar.style.bottom = "0";
        betCount.textContent = selectedBets.length;
      } else {
        betBar.style.bottom = "-80px";
      }
    }

    // Create a single game card
    function renderOneGame(game, mount) {
      const block = document.createElement("div");
      block.className = "odds-block";

      const match = document.createElement("div");
      match.textContent = `${game.away} @ ${game.home}`;
      const time = document.createElement("div");
      time.textContent = `Start Time: ${formatTime(game.startsAt)}`;
      block.appendChild(match);
      block.appendChild(time);

      // Odds table
      const table = document.createElement("table");
      table.className = "odds-table";
      table.innerHTML = `
        <thead>
          <tr>
            <th>Team</th>
            <th>ML</th>
            <th>Spread</th>
            <th>O/U</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>${game.home}</strong></td>
            <td class="bet-cell" data-type="ML">${game.odds.fanduel.homeML.odds}</td>
            <td class="bet-cell" data-type="Spread">${game.odds.fanduel.homeSpread.odds}<br>${game.odds.fanduel.homeSpread.value}</td>
            <td class="bet-cell" data-type="O/U">${game.odds.fanduel.over.odds}<br>O ${game.odds.fanduel.over.value}</td>
          </tr>
          <tr>
            <td><strong>${game.away}</strong></td>
            <td class="bet-cell" data-type="ML">${game.odds.fanduel.awayML.odds}</td>
            <td class="bet-cell" data-type="Spread">${game.odds.fanduel.awaySpread.odds}<br>${game.odds.fanduel.awaySpread.value}</td>
            <td class="bet-cell" data-type="O/U">${game.odds.fanduel.under.odds}<br>U ${game.odds.fanduel.under.value}</td>
          </tr>
        </tbody>
      `;
      block.appendChild(table);
      mount.appendChild(block);

      // Clickable bet cells
      table.querySelectorAll(".bet-cell").forEach((cell) => {
        cell.addEventListener("click", () => {
          const type = cell.getAttribute("data-type");
          const team = cell.parentElement.children[0].textContent.trim();
          toggleBetSelection(cell, {
            game: `${game.away} @ ${game.home}`,
            team,
            type,
            value: cell.innerText.trim(),
          });
        });
      });
    }
  </script>
</head>

<body style="display:none;">
  <!-- main navbar -->
  <nav class="navbar">
    <h2>BetTracker</h2>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="registration.html">Register</a></li>
      <li>
        <a href="portfolio.html" title="My Account">
          <span style="font-size: 1.3rem;">👤</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- sportsbooks navbar -->
  <div class="subnav">
    <div class="subnav-inner">
      <a href="fanduel.html" class="active">FanDuel</a>
      <a href="draftkings.html">Draft Kings</a>
      <a href="betmgm.html">BetMGM</a>
      <a href="caesars.html">Caesars</a>
      <a href="espnbet.html">ESPN BET</a>
      <a href="bovada.html">Bovada</a>
      <a href="unibet.html">Unibet</a>
      <a href="pointsbet.html">PointsBet</a>
    </div>
  </div>

  <!-- main content -->
  <div class="container">
    <div class="card">
      <h1>FanDuel</h1>
      <p>Displaying current NFL odds from FanDuel.</p>
    </div>

    <div id="oddsContainer"></div>
  </div>

  <!-- Floating Bet Bar -->
  <div id="betBar">
    <span id="betCount">0</span> bets selected
    <button id="placeBetBtn">Place Bet</button>
  </div>
</body>
</html>
